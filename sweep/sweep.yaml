entity: ghuang-nlp
project: absolute-bert
program: sweep/sweep.py

method: bayes
metric:
  # name: highlight-scifact-static_embeddings/NDCG@10
  name: train/loss
  goal: minimize

parameters:
  wandb.job_type:
    value: "sweep"
  config:
    value: "configs/default_sweep.yaml"

  optimizer.lr:
    distribution: log_uniform_values
    min: 5e-4
    max: 2e-3

  # scheduler.warmup_ratio:
  #   min: 0.05
  #   max: 0.2

  model.q_temperature:
    min: 0.1
    max: 1.0

  model.k_temperature:
    min: 0.1
    max: 1.0

  model.log_granularity:
    distribution: int_uniform
    min: 2
    max: 6

  train.masking_probability:
    # values: [0.1, 0.15, 0.2, 0.3]
    min: 0.05
    max: 0.5

  # scheduler.type:
  #   values: ["cosine", "linear", "constant"]

  